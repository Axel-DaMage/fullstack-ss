name: CD / Deploy a AWS

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: backend
      
      - name: Checkout Frontend code
        uses: actions/checkout@v4
        with:
          repository: Axel-DaMage/fullstack-ss-frontend
          ref: main
          path: frontend
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build
      
      - name: Copy Frontend to Backend static resources
        run: |
          mkdir -p backend/pet-service/src/main/resources/static
          cp -r frontend/dist/* backend/pet-service/src/main/resources/static/
          echo "Frontend copied to backend"
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Build Microservices
        run: |
          cd backend/pet-service && mvn clean package -DskipTests
          cd ../geo-service && mvn clean package -DskipTests
          cd ../match-service && mvn clean package -DskipTests
          cd ../bff && mvn clean package -DskipTests
          cd ../api-gateway && mvn clean package -DskipTests
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      
      - name: Create S3 bucket
        run: |
          BUCKET_NAME="sanosysalvos-${{ secrets.AWS_ACCOUNT_ID }}"
          aws s3 mb s3://${BUCKET_NAME} --region us-east-1 2>/dev/null || echo "Bucket already exists"
          echo "BUCKET_NAME=${BUCKET_NAME}" >> $GITHUB_ENV
      
      - name: Upload JARs to S3
        run: |
          BUCKET_NAME=${{ env.BUCKET_NAME }}
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          
          # Upload each microservice
          for service in pet-service geo-service match-service bff api-gateway; do
            JAR_FILE=$(ls backend/$service/target/*.jar 2>/dev/null | grep -v original | head -1)
            if [ -n "$JAR_FILE" ]; then
              aws s3 cp $JAR_FILE s3://${BUCKET_NAME}/${service}-latest.jar --metadata "commit-sha=${{ github.sha }}"
              echo "Uploaded $service: $JAR_FILE"
            fi
          done
      
      - name: Check for EC2 instance
        id: check-ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=sanosysalvos-backend" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text 2>/dev/null || echo "None")
          
          if [ "$INSTANCE_ID" != "None" ] && [ ! -z "$INSTANCE_ID" ]; then
            echo "instance-id=$INSTANCE_ID" >> $GITHUB_OUTPUT
            echo "instance-exists=true" >> $GITHUB_OUTPUT
            
            PUBLIC_IP=$(aws ec2 describe-instances \
              --instance-ids $INSTANCE_ID \
              --query "Reservations[0].Instances[0].PublicIpAddress" \
              --output text)
            echo "public-ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
          else
            echo "instance-exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Deploy to EC2
        if: steps.check-ec2.outputs.instance-exists == 'true'
        run: |
          INSTANCE_ID="${{ steps.check-ec2.outputs.instance-id }}"
          
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "S3_BUCKET=${{ env.BUCKET_NAME }}",
              "REGION=us-east-1",
              "aws s3 cp s3://${S3_BUCKET}/pet-service-latest.jar /tmp/pet-service.jar --region ${REGION}",
              "aws s3 cp s3://${S3_BUCKET}/geo-service-latest.jar /tmp/geo-service.jar --region ${REGION}",
              "aws s3 cp s3://${S3_BUCKET}/match-service-latest.jar /tmp/match-service.jar --region ${REGION}",
              "aws s3 cp s3://${S3_BUCKET}/bff-latest.jar /tmp/bff.jar --region ${REGION}",
              "aws s3 cp s3://${S3_BUCKET}/api-gateway-latest.jar /tmp/api-gateway.jar --region ${REGION}",
              "curl -fsSL -o /tmp/docker-compose.yml https://raw.githubusercontent.com/Axel-DaMage/fullstack-ss/master/docker-compose.prod.yml",
              "cd /tmp",
              "docker compose up -d",
              "echo \"Deployment completed\""
            ]' \
            --region us-east-1 \
            --output text \
            --query 'Command.CommandId')
          echo "SSM command sent: $COMMAND_ID"
      
      - name: Deployment Summary
        run: |
          echo "================================"
          echo "DEPLOYMENT SUMMARY"
          echo "================================"
          echo "S3 Bucket: ${{ env.BUCKET_NAME }}"
          echo "Commit: ${{ github.sha }}"
          echo ""
          
          if [ "${{ steps.check-ec2.outputs.instance-exists }}" == "true" ]; then
            echo "EC2 Instance: ${{ steps.check-ec2.outputs.instance-id }}"
            echo "Public IP: ${{ steps.check-ec2.outputs.public-ip }}"
            echo "API Gateway: http://${{ steps.check-ec2.outputs.public-ip }}:8080"
          else
            echo "No EC2 instance running"
            echo "Create EC2 with tag: Name=sanosysalvos-backend"
          fi