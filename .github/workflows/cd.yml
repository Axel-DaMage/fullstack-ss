name: CD / Deploy a AWS

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Pet Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/pet-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.actor }}/pet-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Geo Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/geo-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.actor }}/geo-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Match Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/match-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.actor }}/match-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push BFF
        uses: docker/build-push-action@v5
        with:
          context: ./backend/bff
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.actor }}/bff:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./backend/api-gateway
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.actor }}/api-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.actor }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to Cloud (Example: AWS ECS)
        run: |
          echo "Deploying to production..."
          echo "Images pushed to: ${{ env.REGISTRY }}/${{ github.actor }}/*"
          # Add your deployment commands here
          # Example: aws ecs update-service --cluster production --service pet-service

      - name: Notify Deployment
        if: always()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "Deployment ${{ job.status }} for ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment ${{ job.status }}*\nRepository: ${{ github.repository }}\nCommit: ${{ github.sha }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'