name: CI - Continuous Integration

on:
  push:
    branches: [ master, develop, '**' ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build-pet-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Pet Service
        working-directory: ./backend/pet-service
        run: mvn clean package -DskipTests

      - name: Run Pet Service Tests
        working-directory: ./backend/pet-service
        run: mvn test

  build-geo-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Geo Service
        working-directory: ./backend/geo-service
        run: mvn clean package -DskipTests

      - name: Run Geo Service Tests
        working-directory: ./backend/geo-service
        run: mvn test

  build-match-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Match Service
        working-directory: ./backend/match-service
        run: mvn clean package -DskipTests

      - name: Run Match Service Tests
        working-directory: ./backend/match-service
        run: mvn test

  build-bff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build BFF
        working-directory: ./backend/bff
        run: mvn clean package -DskipTests

      - name: Run BFF Tests
        working-directory: ./backend/bff
        run: mvn test

  build-api-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build API Gateway
        working-directory: ./backend/api-gateway
        run: mvn clean package -DskipTests

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

  build-docker:
    runs-on: ubuntu-latest
    needs: [build-pet-service, build-geo-service, build-match-service, build-bff, build-api-gateway, build-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker compose build --parallel

      - name: Verify containers
        run: docker compose config --services